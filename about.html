            <img class="mySlide" src="Library image.jpg" style="width:100%; height:300px;">
             <img class="mySlide" src="Library image-1.jpg" style="width:100%; height:300px;">
              <img class="mySlide" src="Library image-2.jpg" style="width:100%; height:300px;">
               <img class="mySlide" src="Library image-3.jpg" style="width:100%; height:300px;">
                <img class="mySlide" src="Library image-4.jpg" style="width:100%; height:300px;">
        </section>
<script>
     var myIndex = 0;
            carousel();
            function carousel() {
                var i;
                var x = document.getElementsByClassName("mySlide");
                for(i=0; i < x.length; i++) {
                    x[i].style.display = "none";
                }
                myIndex++;
                if(myIndex >x.length) {myIndex = 1}
                x[myIndex-1].style.display = "block";
                setTimeout(carousel, 3000);
            }
</script>
    </body>
